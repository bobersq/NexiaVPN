name: Build NexiaVPN.exe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller requests

      - name: Build EXE
        run: |
          pyinstaller --name NexiaVPN --onefile --windowed --add-data "assets;assets" --hidden-import PySide6.QtCore --hidden-import PySide6.QtGui --hidden-import PySide6.QtWidgets --collect-all PySide6 --noconfirm main.py

      - name: Prepare dist folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\bin
          New-Item -ItemType Directory -Force -Path dist\config
          New-Item -ItemType Directory -Force -Path dist\logs
          Copy-Item assets\icon.svg dist\assets\ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist\* -DestinationPath NexiaVPN-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexiaVPN-windows-x64
          path: NexiaVPN-windows-x64.zip
          retention-days: 30
        
