name: Build NexiaVPN.exe

on:
  workflow_dispatch:  # Run manually from GitHub Actions tab
  push:
    tags:
      - 'v*'         # Also run on version tags like v1.0.0

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6>=6.6.0
          pip install pyinstaller
          pip install requests

      - name: Generate icon
        run: |
          python create_icon.py
        continue-on-error: true  # Don't fail if icon generation has issues

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller `
            --name NexiaVPN `
            --onefile `
            --windowed `
            --add-data "assets;assets" `
            --hidden-import PySide6.QtCore `
            --hidden-import PySide6.QtGui `
            --hidden-import PySide6.QtWidgets `
            --hidden-import PySide6.QtNetwork `
            --collect-all PySide6 `
            --noconfirm `
            main.py

      - name: Copy xray placeholder folder
        run: |
          New-Item -ItemType Directory -Force -Path dist\bin
          New-Item -ItemType Directory -Force -Path dist\config
          New-Item -ItemType Directory -Force -Path dist\logs
          New-Item -ItemType Directory -Force -Path dist\assets
          if (Test-Path assets\icon.png) {
            Copy-Item assets\icon.png dist\assets\
          }
          if (Test-Path assets\icon.svg) {
            Copy-Item assets\icon.svg dist\assets\
          }
        shell: pwsh

      - name: Create README for dist
        run: |
          @"
          NexiaVPN v1.0.0
          ===============
          1. Run NexiaVPN.exe
          2. On first launch it will download xray-core automatically
          3. Add a server via '+ Add' button (paste vless:// vmess:// trojan:// ss:// link)
          4. Double-click server to connect
          5. Set browser proxy: HTTP 127.0.0.1:10808  SOCKS5 127.0.0.1:10809
          "@ | Out-File -FilePath dist\README.txt -Encoding UTF8
        shell: pwsh

      - name: Zip the dist folder
        run: |
          Compress-Archive -Path dist\* -DestinationPath NexiaVPN-windows-x64.zip
        shell: pwsh

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexiaVPN-windows-x64
          path: NexiaVPN-windows-x64.zip
          retention-days: 30

      - name: Upload raw EXE
        uses: actions/upload-artifact@v4
        with:
          name: NexiaVPN-exe-only
          path: dist/NexiaVPN.exe
          retention-days: 30

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            NexiaVPN-windows-x64.zip
            dist/NexiaVPN.exe
          generate_release_notes: true
